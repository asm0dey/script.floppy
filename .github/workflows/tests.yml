name: tests
on: [push, pull_request]
jobs:
  test:
    # 3.11 is Kodi 21 (Omega)'s interpreter and the syntax floor; 3.13 guards
    # against breakage on newer interpreters.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # Each leg builds its venv on its own interpreter, never mise's 3.11.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      # Pinned by commit SHA: a mutable tag lets the action's owner change
      # what runs in CI after review. Renovate tracks the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # --locked installs uv.lock exactly; --no-build forbids sdist setup scripts.
      - run: uv sync --locked --extra dev --no-install-project --no-build
      - run: uv run --no-sync python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version"
      - run: uv run --no-sync --no-build ruff check .
      - run: uv run --no-sync --no-build pyright
      - run: uv run --no-sync --no-build pytest -v --strict-markers
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      # After the checks: mise's python/env must not influence them.
      - run: mise run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: addon-zip-${{ matrix.python-version }}
          path: dist/*.zip
