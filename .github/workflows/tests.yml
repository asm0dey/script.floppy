name: tests
on: [push, pull_request]
jobs:
  test:
    # 3.11 is Kodi 21 (Omega)'s interpreter and the syntax floor; 3.13 guards
    # against breakage on newer interpreters.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # Pinned by commit SHA: a mutable tag lets the action's owner change
      # what runs in CI after review. Renovate tracks the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # --locked installs uv.lock exactly; --no-build forbids sdist setup scripts.
      - run: uv sync --locked --extra dev --no-install-project --no-build
      - run: uv run --no-sync --no-build ruff check .
      - run: uv run --no-sync --no-build pyright
      - run: uv run --no-sync --no-build pytest -v --strict-markers
      - run: mise run zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: addon-zip-${{ matrix.python-version }}
          path: dist/*.zip
